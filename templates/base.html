<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}InsightForge AI{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>🔬</text></svg>">
<link rel="stylesheet" href="/static/css/style.css">
{% block extra_head %}{% endblock %}
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark">IF</span>
        <span class="brand-name">InsightForge <strong>AI</strong></span>
      </a>
      <nav class="main-nav" id="main-nav">
        <a href="/dashboard" data-nav="dashboard">Dashboard</a>
        <a href="/research/new" data-nav="new">New Research</a>
        <a href="/history" data-nav="history">History</a>
        <a href="/reports" data-nav="reports">Saved Reports</a>
        <a href="/settings" data-nav="settings">Settings</a>
        <a href="/about" data-nav="about">About</a>
      </nav>
      <div class="topbar-actions">
        <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button id="nav-toggle" class="icon-btn nav-toggle" aria-label="Toggle navigation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div id="toast-stack" class="toast-stack"></div>

  <main class="page-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer">
    <span>InsightForge AI &mdash; Agentic Multi-Model Research Platform</span>
    <span class="footer-dot">&middot;</span>
    <a href="/about">About</a>
    <span>(Was made by Oleh Datsyk)</span>
  </footer>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/app.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
